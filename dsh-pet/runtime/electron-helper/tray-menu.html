<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 本地小窗口：只有内联样式与内联脚本 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>tray</title>
<style>
  /* 透明窗口里只画一块菜单：配色与应用主题一致（浅色 / Windows 11 Fluent 深色） */
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font: 13px/1.5 "Microsoft YaHei UI", "Segoe UI", "PingFang SC", sans-serif;
  }

  :root {
    --menu-bg: rgba(255, 255, 255, 0.98);
    --menu-border: rgba(0, 0, 0, 0.12);
    --menu-shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
    --menu-ink: #2b2b2b;
    --menu-hover: rgba(18, 97, 139, 0.12);
    --menu-sep: rgba(0, 0, 0, 0.1);
    --menu-dim: #9aa0a6;
  }

  html[data-theme='dark'] {
    --menu-bg: rgba(44, 44, 44, 0.97);
    --menu-border: rgba(255, 255, 255, 0.08);
    --menu-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    --menu-ink: #ffffff;
    --menu-hover: rgba(255, 255, 255, 0.08);
    --menu-sep: rgba(255, 255, 255, 0.08);
    --menu-dim: rgba(255, 255, 255, 0.54);
  }

  #menu {
    display: inline-flex;
    flex-direction: column;
    min-width: 150px;
    padding: 4px;
    border-radius: 8px;
    background: var(--menu-bg);
    border: 1px solid var(--menu-border);
    box-shadow: var(--menu-shadow);
    color: var(--menu-ink);
    backdrop-filter: blur(12px) saturate(1.1);
  }

  .item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: default;
    white-space: nowrap;
  }

  .item:hover { background: var(--menu-hover); }

  .check {
    width: 12px;
    flex: 0 0 auto;
    font-size: 11px;
    color: var(--menu-ink);
  }

  .label { flex: 1 1 auto; }

  .sep {
    height: 1px;
    margin: 4px 6px;
    background: var(--menu-sep);
  }
</style>
</head>
<body>
<div id="menu" role="menu"></div>
<script>
  'use strict';

  // 主题：与设置窗口共用同一个 localStorage 键（同源 file://）。
  // 这个窗口是**常驻预热**的（启动后就建好藏着），只在加载时读一次会一直是旧主题——
  // 所以两条路都留着：① 主进程切换主题时广播（隐藏中也会收到）；② 每次弹菜单前重读一次 localStorage。
  function applyTheme(next) {
    document.documentElement.dataset.theme = next === 'dark' ? 'dark' : 'light';
  }

  function readTheme() {
    try {
      return localStorage.getItem('dsh-pet-settings-theme') === 'dark' ? 'dark' : 'light';
    } catch {
      return 'light'; // 读不到就按浅色
    }
  }

  applyTheme(readTheme());
  if (window.trayMenu && typeof window.trayMenu.onTheme === 'function') {
    window.trayMenu.onTheme(applyTheme);
  }

  let data = null;

  function item(label, extra) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'item';
    btn.setAttribute('role', 'menuitem');
    const check = document.createElement('span');
    check.className = 'check';
    check.textContent = extra && extra.checked ? '✓' : '';
    const text = document.createElement('span');
    text.className = 'label';
    text.textContent = label;
    btn.append(check, text);
    return btn;
  }

  function reportSize() {
    const rect = document.getElementById('menu').getBoundingClientRect();
    window.trayMenu.size({ width: Math.ceil(rect.width), height: Math.ceil(rect.height) });
  }

  function render() {
    const menu = document.getElementById('menu');
    menu.replaceChildren();
    for (const pet of data.pets || []) {
      const btn = item(pet.name, { checked: pet.checked });
      btn.addEventListener('click', () => window.trayMenu.select({ action: 'pet', id: pet.id, display: pet.display }));
      menu.appendChild(btn);
    }
    if (data.canQuit) {
      const sep = document.createElement('div');
      sep.className = 'sep';
      menu.appendChild(sep);
      const quit = item('退出');
      quit.addEventListener('click', () => window.trayMenu.select({ action: 'quit' }));
      menu.appendChild(quit);
    }
    requestAnimationFrame(reportSize);
  }

  window.trayMenu.onData((payload) => {
    // 每次弹菜单前都重新读一次主题：兜住"广播没送到"（窗口被重建、事件丢了）的情况，
    // 菜单永远跟设置窗口当前的选择一致。
    applyTheme(readTheme());
    data = payload || { pets: [], canQuit: false };
    render();
  });

  // Esc / 点到空白关闭
  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') window.trayMenu.close();
  });
  window.addEventListener('blur', () => window.trayMenu.close());
</script>
</body>
</html>
